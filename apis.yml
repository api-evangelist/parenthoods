name: parenthoods
description: >-
  Parenthoods was a Y Combinator-backed mobile social network for parents,
  founded in 2014 by Siobhan Quinn and Jeni Axline in San Francisco, that helped
  local moms and dads discover nearby parents and share parenting experiences to
  counter the social isolation of early parenthood. The company raised a $1.32M
  seed round in November 2014 with participation from Slow Ventures, Lowercase
  Capital, 500 Global, and Y Combinator. The product shipped as an iOS mobile
  application and never published a public developer API, OpenAPI definition,
  SDKs, or documentation portal. The parenthoods.com domain now redirects to
  Wonderschool, and this profile is retained in the API Evangelist network as a
  Slow Ventures portfolio lead with no discoverable API surface.
